name: Sync Mirror Repository

on:
  push:
    branches:
      - main
      - dev
      - "**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repo
        uses: actions/checkout@v5
        with:
          repository: WDS-Services/WEB-BACKOFFICE-BR
          token: ${{ secrets.MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Push to personal mirror
        run: |
          git remote set-url origin https://token:${{ secrets.MIRROR_TOKEN }}@github.com/thaissolino/WEB-BACKOFFICE-BR.git
          # Espelha todas as branches sem deletar refs no destino.
          # (git push --mirror tentava apagar 'main' no mirror e falhava,
          # pois o checkout do Actions só cria ref local da branch do trigger.)
          git push --force origin "refs/remotes/origin/*:refs/heads/*"
